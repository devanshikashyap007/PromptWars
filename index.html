<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StadiumFlow AI | The Ultimate Event Companion</title>
    <meta name="description" content="Experience large-scale events like never before with real-time crowd insights, queue tracking, and smart navigation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg"></div>
    <main id="app">
        <header class="glass">
            <div class="logo">
                <span class="pulse"></span>
                <h1>Stadium<span>Flow</span></h1>
            </div>
            <nav>
                <button class="icon-btn" id="notifications" aria-label="Notifications">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
            </nav>
        </header>

        <section class="hero glass">
            <div class="status-card">
                <p>Welcome, Section 104!</p>
                <h2>Event: Final Championship 2026</h2>
                <div class="badge live">LIVE</div>
            </div>
        </section>

        <section class="grid">
            <div class="card glass interactive" id="live-map">
                <div class="card-header">
                    <h3>Live Density Map</h3>
                    <p>Real-time crowd flow</p>
                </div>
                <div class="map-container">
                    <!-- SVG Map Placeholder -->
                    <svg id="venue-map" viewBox="0 0 200 120">
                        <path class="stadium-base" d="M20,60 Q20,20 100,20 Q180,20 180,60 Q180,100 100,100 Q20,100 20,60" fill="rgba(15, 23, 42, 0.05)" stroke="var(--blue)" stroke-width="2"/>
                        <!-- Zones -->
                        <path class="zone" d="M40,40 Q40,30 100,30 Q160,30 160,40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 2" />
                        <path class="zone" d="M40,80 Q40,90 100,90 Q160,90 160,80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 2" />
                        
                        <!-- Real-time points -->
                        <circle class="heatmap-point" cx="50" cy="45" r="5" fill="var(--magenta)"/>
                        <circle class="heatmap-point" cx="150" cy="75" r="8" fill="var(--magenta)"/>
                        <circle class="heatmap-point" cx="100" cy="85" r="10" fill="var(--magenta)"/>
                        
                        <!-- User Seat Indicator -->
                        <circle id="user-seat" cx="100" cy="40" r="4" fill="var(--blue)" style="display: none;" />
                        <path id="seat-path" d="" fill="none" stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 2" />
                    </svg>
                </div>
            </div>

            <div class="card glass interactive" id="queue-tracker">
                <div class="card-header">
                    <h3>Queue Tracker</h3>
                    <p>Estimated wait times</p>
                </div>
                <ul class="queue-list">
                    <li>
                        <div class="info">
                            <span class="label">Main Concessions</span>
                            <span class="value">~8 mins</span>
                        </div>
                        <div class="progress-bar"><div class="fill yellow" style="width: 40%;"></div></div>
                    </li>
                    <li>
                        <div class="info">
                            <span class="label">South Gates Exit</span>
                            <span class="value">Heavy</span>
                        </div>
                        <div class="progress-bar"><div class="fill red" style="width: 85%;"></div></div>
                    </li>
                    <li>
                        <div class="info">
                            <span class="label">Restrooms (Level 2)</span>
                            <span class="value">~2 mins</span>
                        </div>
                        <div class="progress-bar"><div class="fill green" style="width: 15%;"></div></div>
                    </li>
                </ul>
            </div>
        </section>

        <section class="action-bar glass">
            <button class="primary-btn">Find My Seat</button>
            <button class="secondary-btn">Order Food</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
